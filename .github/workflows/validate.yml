name: Validate policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.10"
      - name: Validate JSON and prompt references
        run: |
          python - <<'PY'
          import json
          import pathlib

          root = pathlib.Path(".")
          rubric = json.loads((root / "rubric.json").read_text())
          review_schema = json.loads((root / "schemas/review.schema.json").read_text())
          ids = [step["id"] for step in rubric["steps"]]
          assert len(ids) == len(set(ids)), "duplicate rubric step"
          assert ids[-1] == "synthesis", "synthesis must be last"
          assert rubric["schema_version"] == 7
          assert rubric["step_result"]["verdicts"] == ["pass", "warn", "fail"]
          assert review_schema["properties"]["schema_version"]["const"] == 2
          assert review_schema["properties"]["decision"]["enum"] == ["accept", "revise", "reject"]
          assert review_schema["properties"]["passes"]["items"]["properties"]["verdict"]["enum"] == ["pass", "warn", "fail"]
          minimum = rubric["minimum_accept_score"]
          assert isinstance(minimum, int) and not isinstance(minimum, bool) and 1 <= minimum <= 5
          registry_scores = rubric["registry_scores"]
          assert len(registry_scores) == len(set(registry_scores))
          expected_registry_scores = {
              "statement_alignment",
              "definition_fidelity",
              "notability",
              "literature",
              "clarity",
          }
          assert set(registry_scores) == expected_registry_scores
          allowed_scores = expected_registry_scores | {
              "provenance",
              "auditability",
              "proof_alignment",
              "classification",
          }
          allowed_inputs = {
              "all_previous_results",
              "challenge_source",
              "comparator_config",
              "formalization_metadata",
              "submission",
              "lakefile",
              "lean_toolchain",
              "mechanical_report",
              "project_readme",
              "solution_source",
          }
          mandatory_reject = rubric.get("mandatory_reject_below_minimum", [])
          assert len(mandatory_reject) == len(set(mandatory_reject))
          assert set(mandatory_reject) <= set(registry_scores)
          owned_scores = []
          owners = {}
          for step in rubric["steps"]:
              path = root / step["prompt"]
              assert path.is_file(), f"missing prompt: {path}"
              assert path.read_text().strip(), f"empty prompt: {path}"
              if step["id"] != "synthesis":
                  score_keys = step["score_keys"]
                  assert score_keys and len(score_keys) == len(set(score_keys))
                  assert set(score_keys) <= allowed_scores
                  assert "policy:CONTRIBUTING.md" in step["inputs"]
                  assert "policy:rubric.json" in step["inputs"]
                  owned_scores.extend(score_keys)
                  owners.update({key: step for key in score_keys})
              for input_name in step.get("inputs", []):
                  if input_name.startswith("policy:"):
                      policy_path = root / input_name.removeprefix("policy:")
                      assert policy_path.is_file(), f"missing policy input: {policy_path}"
                  else:
                      assert input_name in allowed_inputs, f"unknown rubric input: {input_name}"
          assert len(owned_scores) == len(set(owned_scores)), "duplicate score owner"
          assert set(registry_scores) <= set(owned_scores)
          assert all(owners[key]["required"] for key in registry_scores)
          coverage_steps = {
              step["id"] for step in rubric["steps"]
              if step.get("requires_declaration_coverage") is True
          }
          assert coverage_steps == {
              "statement_alignment",
              "definition_fidelity",
              "literature_notability",
              "proof_account",
          }
          print(f"validated {len(ids)} review steps")
          PY
